@if (canEdit()) {
  <button
    type="button"
    (click)="toggle()"
    [attr.aria-pressed]="isEditing()"
    [class]="isEditing()
      ? 'btn btn-accent fixed bottom-6 right-6 z-50 shadow-lg'
      : 'btn btn-solid fixed bottom-6 right-6 z-50 shadow-lg'"
  >
    <app-morph-icon [icon]="isEditing() ? closeIcon : editIcon" class="h-4 w-4" />
    {{ isEditing() ? 'Terminar edición' : 'Modo edición' }}
  </button>
}
