<article class="group grid gap-8 border-t border-border py-12 transition-colors duration-300 md:grid-cols-12 md:items-center md:gap-10 md:py-14">
  <!-- Texto -->
  <div class="md:col-span-6 lg:col-span-7">
    <p class="text-xs font-bold tracking-[0.3em] text-accent-deep">0{{ index() + 1 }}<span class="mx-2 text-border">/</span>{{ service().slug }}</p>
    <h2 class="mt-4 text-3xl font-bold leading-tight tracking-[-0.02em] transition-colors duration-300 group-hover:text-accent-deep md:text-4xl">{{ service().name }}</h2>
    <p class="mt-4 max-w-xl text-base leading-7 text-muted-foreground">{{ service().description }}</p>
    <div class="mt-7 flex items-center gap-2 text-[11px] font-bold uppercase tracking-[0.22em] text-muted-foreground transition-colors duration-300 group-hover:text-accent-deep">
      Servicio Ingesocc <svg lucideArrowRight class="h-4 w-4 transition-transform duration-300 group-hover:translate-x-1" />
    </div>
  </div>

  <!-- Imagen (si existe) o ícono de respaldo -->
  <div class="md:col-span-6 lg:col-span-5">
    @if (service().photoUrl) {
      <div class="media-zoom aspect-[16/10] w-full bg-secondary">
        <img [src]="service().photoUrl" [alt]="service().name" loading="lazy" class="h-full w-full object-cover" />
      </div>
    } @else if (iconComponent()) {
      <div class="flex aspect-[16/10] w-full items-center justify-center border border-border bg-surface text-accent transition-colors duration-300 group-hover:border-accent/60">
        <ng-container [ngComponentOutlet]="iconComponent()" [ngComponentOutletInputs]="{ size: 64 }" />
      </div>
    } @else {
      <div class="aspect-[16/10] w-full bg-secondary"></div>
    }
  </div>
</article>
