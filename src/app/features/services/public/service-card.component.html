<article class="group relative flex h-full flex-col overflow-hidden bg-secondary">
  @if (service().photoUrl) {
    <img
      [src]="service().photoUrl"
      [alt]="service().name"
      class="h-64 w-full object-cover transition-transform duration-700 group-hover:scale-105"
    />
  } @else if (iconComponent()) {
    <div class="flex h-64 items-center justify-center bg-primary text-accent">
      <ng-container [ngComponentOutlet]="iconComponent()" [ngComponentOutletInputs]="{ size: 56 }" />
    </div>
  }
  <div class="flex flex-1 flex-col p-7">
    <h2 class="text-2xl font-bold tracking-tight">{{ service().name }}</h2>
    <p class="mt-3 text-sm leading-6 text-muted-foreground">{{ service().description }}</p>
  </div>
</article>
