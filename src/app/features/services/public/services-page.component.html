<section class="relative bg-primary px-5 pb-20 pt-40 text-white md:px-10 md:pb-28">
  <div class="mx-auto max-w-[1440px]">
    <p class="mb-6 text-xs font-semibold uppercase tracking-[0.28em] text-accent">Lo que hacemos</p>
    <h1 class="text-balance text-5xl font-bold leading-[0.95] tracking-[-0.055em] md:text-7xl">Servicios</h1>
    <p class="mt-6 max-w-xl text-base leading-7 text-white/75">
      Del concepto a la realidad: soluciones integrales de ingeniería, construcción y fabricación metálica.
    </p>
  </div>
</section>

<section class="px-5 py-16 md:px-10 md:py-24">
  <div class="mx-auto grid max-w-[1440px] gap-6 md:grid-cols-2 lg:grid-cols-3">
    @for (service of services(); track service.slug) {
      <app-service-card [service]="service" />
    } @empty {
      <div class="md:col-span-2 lg:col-span-3">
        <p class="text-sm text-muted-foreground">Todavía no hay servicios publicados.</p>
      </div>
    }
  </div>
</section>
