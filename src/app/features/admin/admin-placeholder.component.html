<div class="mx-auto max-w-3xl">
  <p class="mb-3 text-xs font-bold uppercase tracking-[0.25em] text-accent">En construcción</p>
  <h1 class="text-4xl font-bold tracking-[-0.04em]">{{ title() }}</h1>
  @if (phase()) {
    <p class="mt-6 inline-block rounded-full border border-border px-5 py-2.5 text-xs font-bold uppercase tracking-widest text-muted-foreground">{{ phase() }}</p>
  }
  <p class="mt-6 max-w-xl text-sm leading-6 text-muted-foreground">
    {{ description() || 'Este módulo del panel se construye en una fase posterior del plan técnico.' }}
  </p>
</div>
