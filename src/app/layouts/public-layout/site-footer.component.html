<footer class="bg-primary px-5 py-10 text-white md:px-10">
  <div class="mx-auto flex max-w-[1440px] flex-col justify-between gap-8 md:flex-row md:items-end">
    <div class="flex items-center gap-3">
      <img src="/ingesocc-logo.jpg" alt="Ingesocc S.A.S." width="42" height="42" class="h-10 w-10 rounded-full object-cover" />
      <div>
        <p class="text-sm font-bold uppercase tracking-[0.2em]">Ingesocc S.A.S.</p>
        <p class="mt-1 text-xs text-white/50">Visionarios del diseño</p>
      </div>
    </div>
    <div class="flex gap-6 text-xs uppercase tracking-widest text-white/60">
      <a [href]="instagram()" target="_blank" rel="noopener" class="hover:text-accent"><app-editable-text page="global" sectionKey="social_instagram" [fallback]="instagram()" /></a>
      <a [href]="linkedin()" target="_blank" rel="noopener" class="hover:text-accent"><app-editable-text page="global" sectionKey="social_linkedin" [fallback]="linkedin()" /></a>
      <a [href]="facebook()" target="_blank" rel="noopener" class="hover:text-accent"><app-editable-text page="global" sectionKey="social_facebook" [fallback]="facebook()" /></a>
      <span>© {{ year }}</span>
    </div>
  </div>
</footer>
