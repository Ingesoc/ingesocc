<div class="min-h-screen bg-background text-foreground">
  <!-- ── SIDEBAR (desktop) ─────────────────────────────── -->
  <aside class="sticky top-0 hidden h-screen w-64 shrink-0 flex-col bg-primary text-white md:flex">
    <a routerLink="/admin" class="flex items-center gap-3 px-6 pb-6 pt-7">
      <span class="flex h-10 w-10 shrink-0 items-center justify-center overflow-hidden rounded-full border border-white/20">
        <img src="/logo/logo.png" alt="" width="40" height="40" class="h-full w-full object-cover" />
      </span>
      <span class="flex flex-col leading-none">
        <span class="text-sm font-bold uppercase tracking-[0.18em]">Ingesocc</span>
        <span class="mt-1 text-[9px] font-semibold uppercase tracking-[0.3em] text-white/45">Panel admin</span>
      </span>
    </a>

    <nav class="flex flex-1 flex-col gap-1 px-4" aria-label="Navegación del panel">
      <p class="mb-1 px-3 pt-2 text-[9px] font-bold uppercase tracking-[0.3em] text-white/35">Gestión</p>
      @for (item of navItems; track item.link) {
        <a
          [routerLink]="item.link"
          routerLinkActive="bg-white/[0.07] text-white"
          [routerLinkActiveOptions]="{ exact: item.exact }"
          class="group relative flex items-center gap-3 rounded-sm px-3 py-2.5 text-[13px] font-semibold text-white/60 transition-colors duration-150 hover:bg-white/[0.06] hover:text-white"
        >
          <span [class]="isActive(item) ? 'absolute left-0 top-1/2 h-4 w-[3px] -translate-y-1/2 rounded-full bg-accent' : 'absolute left-0 top-1/2 h-4 w-[3px] -translate-y-1/2 rounded-full bg-transparent'"></span>
          <ng-container [ngSwitch]="item.icon">
            <svg *ngSwitchCase="'dashboard'" lucideLayoutDashboard class="h-[18px] w-[18px]" />
            <svg *ngSwitchCase="'projects'" lucideFolderKanban class="h-[18px] w-[18px]" />
            <svg *ngSwitchCase="'services'" lucideWrench class="h-[18px] w-[18px]" />
            <svg *ngSwitchCase="'content'" lucidePenLine class="h-[18px] w-[18px]" />
            <svg *ngSwitchCase="'messages'" lucideInbox class="h-[18px] w-[18px]" />
          </ng-container>
          {{ item.label }}
        </a>
      }
    </nav>

    <div class="border-t border-white/10 px-6 py-5">
      <p class="text-[9px] font-bold uppercase tracking-[0.3em] text-white/30">Ingesocc S.A.S. · © {{ year }}</p>
    </div>
  </aside>

  <!-- ── CONTENIDO ─────────────────────────────────────── -->
  <div class="flex min-w-0 flex-1 flex-col md:pl-64">
    <!-- Topbar -->
    <header class="sticky top-0 z-30 border-b border-border bg-surface/95 backdrop-blur">
      <div class="flex h-16 items-center gap-4 px-5 md:px-8">
        <button
          type="button"
          (click)="toggleMobileMenu()"
          [attr.aria-expanded]="mobileMenuOpen()"
          aria-label="Abrir menú del panel"
          class="flex h-10 w-10 items-center justify-center rounded-sm border border-border text-muted-foreground transition-colors hover:border-accent-deep hover:text-accent-deep md:hidden"
        >
          @if (mobileMenuOpen()) {
            <svg lucideX class="h-5 w-5" />
          } @else {
            <svg lucideMenu class="h-5 w-5" />
          }
        </button>

        <nav class="flex items-center gap-2 text-xs" aria-label="Migajas de pan">
          <span class="font-bold uppercase tracking-[0.18em] text-foreground">Panel</span>
          <span class="text-muted-foreground">/</span>
          <span class="font-semibold uppercase tracking-[0.18em] text-muted-foreground">{{ sectionLabel() }}</span>
        </nav>

        <div class="ml-auto flex items-center gap-5">
          <p class="hidden text-xs font-semibold text-muted-foreground lg:block">{{ userEmail() }}</p>
          <button type="button" (click)="logout()" class="flex items-center gap-2 rounded-sm px-2 py-1.5 text-xs font-bold uppercase tracking-[0.14em] text-muted-foreground transition-colors hover:text-accent-deep">
            <svg lucideLogOut class="h-4 w-4" />
            <span class="hidden sm:inline">Cerrar sesión</span>
          </button>
        </div>
      </div>

      <!-- Menú móvil del panel -->
      @if (mobileMenuOpen()) {
        <nav class="border-t border-border bg-surface p-3 md:hidden" aria-label="Navegación móvil del panel">
          @for (item of navItems; track item.link) {
            <a
              [routerLink]="item.link"
              [routerLinkActiveOptions]="{ exact: item.exact }"
              routerLinkActive="bg-secondary text-foreground"
              (click)="toggleMobileMenu()"
              class="flex items-center gap-3 rounded-sm px-4 py-3 text-[13px] font-semibold uppercase tracking-[0.12em] text-muted-foreground transition-colors"
            >
              {{ item.label }}
            </a>
          }
        </nav>
      }
    </header>

    <main class="flex-1 px-5 py-8 md:px-10 md:py-10">
      <router-outlet />
    </main>
  </div>
</div>
